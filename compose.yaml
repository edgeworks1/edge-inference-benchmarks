# Start parameters of all pipeline containers in one place.
#   docker compose build                               # build all images
#   docker compose run --rm ml train -m edge_bench_mlp # run `ble-cs <command>` in a container (CPU)
#   docker compose run --rm ml-gpu train -m ...        # the same on the GPU
services:
  ml:
    build:
      context: ./ml
      target: runtime   # Dockerfile stage (otherwise the last one, dev, would be built)
      args:
        TORCH_VARIANT: cpu
    image: ble-cs:cpu
    volumes:
      # create_host_path: false -> Compose aborts if the folder is missing instead of silently
      # creating it as root (the container user app could not write into it then)
      - type: bind
        source: ./ml/data
        target: /app/data
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ./ml/checkpoints
        target: /app/checkpoints
        bind:
          create_host_path: false
      - type: bind
        source: ./ml/outputs
        target: /app/outputs
        bind:
          create_host_path: false
      # Deliberately NO firmware mount: ml does not know the firmware. Codegen writes to
      # outputs/, ml/Makefile copies into the firmware; measurements come back as run.json via stdin.

  # Like `ml`, but with CUDA torch and GPU access (local training).
  # Needs the NVIDIA Container Toolkit on the host (docs/nvidia_container_toolkit.md).
  ml-gpu:
    extends: ml
    build:
      args:
        TORCH_VARIANT: cu130
    image: ble-cs:cu130
    gpus: all

  # Development tools (ruff, pytest) in the exact versions from uv.lock, CPU only.
  # Uses the dev stage of ml/Dockerfile and mounts ml/ read-write, so `ruff format` edits the
  # host files. Entry point: make -C ml format / lint / check
  ml-dev:
    build:
      context: ./ml
      target: dev
      args:
        TORCH_VARIANT: cpu
    image: ble-cs:dev-cpu
    volumes:
      - type: bind
        source: ./ml
        target: /workspace/ml
        bind:
          create_host_path: false

  # nRF5340 firmware build (Zephyr/NCS). The image holds only tools + SDK; the firmware
  # folder is mounted, so build/ ends up directly on the host.
  #   docker compose run --rm fw                            # default build (see command)
  #   docker compose run --rm fw west build -t menuconfig   # any other command
  fw:
    build:
      context: ./firmware/nrf5340
      target: build
    image: ble-cs-fw:nrf5340
    volumes:
      - type: bind
        source: ./firmware/nrf5340
        target: /app
        bind:
          create_host_path: false
    # Default: variant #1 (Renode) -> build/renode. -S renode = snippet with enlarged memory.
    # -p auto: pristine build if build/ comes from elsewhere (e.g. a WSL build with other paths)
    command: west build -b nrf5340dk_nrf5340_cpuapp -d build/renode -S renode -p auto --no-sysbuild

  # Renode simulation of the built ELF (firmware/nrf5340/build) with profile.resc.
  #   docker compose run --rm fw && docker compose run --rm renode
  renode:
    build:
      context: ./firmware/nrf5340
      target: renode
    image: ble-cs-renode:1.16.1
    volumes:
      - type: bind
        source: ./firmware/nrf5340
        target: /app
        read_only: true   # Renode only reads the ELF and .resc/.repl
        bind:
          create_host_path: false
    # Monitor commands via -e: load the script (starts the simulation), run 10 s wall time, quit.
    # Provisional: to be replaced by renode-test (waits for the UART output instead of a fixed time).
    command: renode --disable-xwt --plain --console -e "include @renode/profile.resc; sleep 10; quit"
