# Configuration shared by both variants (#1 Renode, #2 DK).
# Variant-specific settings live in snippets/<variant>/.

# Optimize for speed (we measure latency); size optimization would save flash instead
# CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SPEED_OPTIMIZATIONS=y

# --- TensorFlow Lite Micro (C++17) with CMSIS-NN kernels ---
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_CPP=y
CONFIG_NEWLIB_LIBC=y
CONFIG_LIB_CPLUSPLUS=y
CONFIG_STD_CPP17=y
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y

# --- Console output over UART (printk, floats for the RESULT line) ---
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_CBPRINTF_FP_SUPPORT=y

# Synchronous logging/printk: no lost output when a lot is printed at once
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK_SYNC=y
CONFIG_LOG_BUFFER_SIZE=8192
