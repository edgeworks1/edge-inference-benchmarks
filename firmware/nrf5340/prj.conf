# Gemeinsame Konfiguration aller Varianten (#1 Renode, #2 DK, #3 BLE).
# Variantenspezifisches steht in snippets/<variante>/.

# Für Size optimieren, damit so wenig Speicher wie möglich gebraucht wird
CONFIG_SIZE_OPTIMIZATIONS=y
# CONFIG_SPEED_OPTIMIZATIONS=y


# Für TFLM C++ aktivieren


# --- Edge Impulse / TensorFlow Lite Micro ---
CONFIG_MAIN_STACK_SIZE=16384
CONFIG_CPP=y                  # C++ Support aktivieren
CONFIG_NEWLIB_LIBC=y
CONFIG_LIB_CPLUSPLUS=y
CONFIG_STD_CPP17=y # C++17 Standard
CONFIG_TENSORFLOW_LITE_MICRO=y
CONFIG_TENSORFLOW_LITE_MICRO_CMSIS_NN_KERNELS=y



# Neu hinzugefügte Sleep Configs
CONFIG_UART_CONSOLE=y
CONFIG_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_LOG=y
CONFIG_PRINTK=y

CONFIG_CBPRINTF_FP_SUPPORT=y

# Synchrones Logging / Printk ohne Buffer-Overflow
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_PRINTK_SYNC=y
CONFIG_LOG_BUFFER_SIZE=8192
