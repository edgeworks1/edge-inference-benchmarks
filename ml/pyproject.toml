[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "edge-ib"
version = "0.1.0"
description = "Train, quantize and benchmark models on edge devices (example: BLE channel sounding distance)"
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- Deep learning ---
    # litert-torch 0.9.x requires torch<2.13. The CUDA/CPU build is chosen via extras below.
    "torch==2.12.1",
    "torchao>=0.17",

    # --- Export & quantization toolchain (fragile, pinned exactly) ---
    "litert-torch==0.9.3",
    "ai-edge-litert==2.1.6",
    "ai-edge-quantizer==0.8.0",
    "onnx==1.22.0",
    "onnxscript==0.7.1",
    "onnxruntime==1.30.0",
    "flatbuffers>=25.0",

    # --- Data & evaluation ---
    "numpy>=2.4",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "scikit-learn>=1.9",

    # --- CLI ---
    "typer>=0.27",
]

[project.scripts]
edge-ib = "edge_ib.cli:app"

[project.optional-dependencies]
# Exactly one of them must be chosen: `uv sync --extra cu130` (local GPU) or `--extra cpu` (CI/Docker).
cpu = ["torch==2.12.1"]
cu130 = ["torch==2.12.1"]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "pytest>=8.0",
    # Pinned exactly: the formatter output may change between versions, which would make
    # every machine produce slightly different formatting.
    "ruff==0.16.10",
]
analysis = [
    "openpyxl>=3.1",
]

[tool.uv]
default-groups = ["dev", "analysis"]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]
# xdsl 0.28 (via ai-edge-litert[model-utils]) caps typing-extensions<4.13, onnx 1.22 needs >=4.15.
# The cap is overly conservative: the export pipeline works with 4.16 (verified by a full export run, 2026-10-02).
override-dependencies = ["typing-extensions>=4.15"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors and warnings
    "F",       # pyflakes: unused imports and variables, undefined names
    "I",       # isort: import order
    "B",       # flake8-bugbear: likely bugs (mutable defaults, loop variable capture ...)
    "UP",      # pyupgrade: modern syntax for the target Python version
    "SIM",     # flake8-simplify: needlessly complicated constructs
    "D1",      # pydocstyle: every public module, class and function needs a docstring
]
ignore = [
    "D104",  # package __init__.py files may stay empty
    "D105",  # magic methods (__repr__ ...) explain themselves
    "D107",  # __init__: the class docstring describes the constructor
]

[tool.ruff.lint.isort]
known-first-party = ["edge_ib"]
