[build-system]
requires = ["uv_build>=0.11.3,<0.12"]
build-backend = "uv_build"

[project]
name = "ble-cs-profiling"
version = "0.1.0"
description = "Training, quantization and edge deployment profiling of BLE channel sounding distance models"
requires-python = ">=3.11,<3.12"
dependencies = [
    # --- Deep learning ---
    # litert-torch 0.9.x requires torch<2.13. The CUDA/CPU build is chosen via extras below.
    "torch==2.12.1",
    "torchao>=0.17",

    # --- Export & quantization toolchain (fragile, pinned exactly) ---
    "litert-torch==0.9.3",
    "ai-edge-litert==2.1.6",
    "ai-edge-quantizer==0.8.0",
    "onnx==1.22.0",
    "onnxscript==0.7.1",
    "onnxruntime==1.30.0",
    "flatbuffers>=25.0",

    # --- Data & evaluation ---
    "numpy>=2.4",
    "pandas>=3.0",
    "pyarrow>=25.0",
    "scikit-learn>=1.9",
]

[project.optional-dependencies]
# Exactly one of them must be chosen: `uv sync --extra cu130` (local GPU) or `--extra cpu` (CI/Docker).
cpu = ["torch==2.12.1"]
cu130 = ["torch==2.12.1"]

[dependency-groups]
dev = [
    "ipykernel>=7.0",
    "pytest>=8.0",
    "ruff>=0.14",
]
analysis = [
    "openpyxl>=3.1",
]

[tool.uv]
default-groups = ["dev", "analysis"]
conflicts = [[{ extra = "cpu" }, { extra = "cu130" }]]
# xdsl 0.28 (via ai-edge-litert[model-utils]) caps typing-extensions<4.13, onnx 1.22 needs >=4.15.
# The cap is overly conservative: the export pipeline works with 4.16 (verified by a full deployer.py run, 2026-10-02).
override-dependencies = ["typing-extensions>=4.15"]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
